name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --prod --audit-level=high
      - name: Type check
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  rust:
    name: rust-${{ matrix.os }}
    needs: ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      # rust-embed at compile time embeds ui/dist into the binary, so the UI
      # bundle must exist before we build.
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      # Ignore list lives in .cargo/audit.toml (transitive deps with no fix available).
      - name: Audit
        run: cargo audit --deny warnings

  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No string-interpolated SQL
        run: |
          if grep -rn --include='*.rs' -E 'format!\s*\(\s*"[^"]*(SELECT|INSERT|UPDATE|DELETE)' crates/; then
            echo "::error::String-interpolated SQL detected. Use sqlx parameter binding."
            exit 1
          fi
      # Match actual code patterns (imports, library calls, env-var reads),
      # not the literal word "telemetry" in marketing copy.
      - name: No telemetry libraries
        run: |
          if grep -rn --include='*.rs' --include='*.ts' --include='*.tsx' \
            -E '(use\s+(posthog|segment|mixpanel|sentry)|import\s+.*\b(posthog|segment|mixpanel|@sentry)\b|@sentry/|posthog\.capture|mixpanel\.track|analytics\.track|process\.env\.(POSTHOG|SEGMENT|MIXPANEL|SENTRY))' \
            crates/ ui/src/; then
            echo "::error::Telemetry library detected. mcpobs ships zero telemetry."
            exit 1
          fi
