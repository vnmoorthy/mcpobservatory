[workspace]
resolver = "2"
members = [
    "crates/mcpobs-core",
    "crates/mcpobs-store",
    "crates/mcpobs-server",
    "crates/mcpobs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/vnmoorthy/mcpobservatory"
homepage = "https://github.com/vnmoorthy/mcpobservatory"
authors = ["MCP Observatory contributors"]

[workspace.dependencies]
# async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
async-trait = "0.1"

# http / web
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "compression-br"] }
hyper = { version = "1.4", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
eventsource-stream = "0.2"

# serde / data
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
similar = { version = "2.6", features = ["serde", "text"] }

# storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono", "json"] }

# cli
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
dirs = "5.0"
shellexpand = "3.1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# errors
anyhow = "1.0"
thiserror = "1.0"

# misc
once_cell = "1.20"
parking_lot = "0.12"
rust-embed = { version = "8.5", features = ["compression"] }
mime_guess = "2.0"
bytes = "1.7"
nix = { version = "0.31", features = ["signal", "process"] }

# internal
mcpobs-core = { path = "crates/mcpobs-core" }
mcpobs-store = { path = "crates/mcpobs-store" }
mcpobs-server = { path = "crates/mcpobs-server" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
